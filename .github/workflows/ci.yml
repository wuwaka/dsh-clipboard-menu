name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # jsdom (the test-only dependency) needs node 22+, and DSH itself
        # requires ^22.19 || >=24, so node 20 is not a supported target.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the test dependency (jsdom)
        run: npm install --no-audit --no-fund

      - name: Run the smoke test
        run: node test/smoke.cjs
